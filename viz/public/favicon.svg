<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Reads as "ball above a floor" at 16px; the decaying ghosts only resolve
       at larger sizes, where they hint at the inelastic bounce sequence. -->
  <defs>
    <radialGradient id="ball" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffe9a8" />
      <stop offset="1" stop-color="#e9a23b" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d1117" />
  <g fill="#e9a23b">
    <circle cx="49" cy="45" r="4.5" opacity="0.20" />
    <circle cx="49" cy="34" r="4.5" opacity="0.12" />
  </g>
  <circle cx="26" cy="27" r="13" fill="url(#ball)" />
  <rect x="8" y="50" width="48" height="2.6" rx="1.3" fill="#4aa3df" />
</svg>
