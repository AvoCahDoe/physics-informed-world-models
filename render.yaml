# Render Blueprint: the visualization is a pure static SPA (rollouts are
# precomputed into viz/public/data), so it needs a CDN, not a server.
services:
  - type: web
    runtime: static
    name: hnn-bouncing-ball
    rootDir: viz
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Vite fingerprints asset filenames, so they are safe to cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Rollout data is regenerated by evaluate.py and is not fingerprinted.
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
